# Redirect SSL to primary domain SSL...
server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/jerome-arfouche.ca/3679037/server.crt;
    ssl_certificate_key /etc/nginx/ssl/jerome-arfouche.ca/3679037/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

    server_name www.jerome-arfouche.ca;
    return 301 https://jerome-arfouche.ca$request_uri;
}

